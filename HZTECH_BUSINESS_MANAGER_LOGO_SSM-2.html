<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HZTECH BUSINESS MANAGER</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:15px Arial}header{background:#1b1b1b;color:#d4af37;text-align:center;padding:22px;font-size:22px;font-weight:bold}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#222;border:1px solid #444;border-radius:14px;padding:16px;margin:12px 0}h2,h3{color:#d4af37;margin-top:0}label{display:block;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#333;color:#fff;font-size:15px}button{border:0;border-radius:9px;padding:13px;background:#d4af37;color:#111;font-weight:bold;font-size:15px;margin:5px 0;width:100%}.secondary{background:#444;color:white}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:600px){.nav{grid-template-columns:repeat(3,1fr)}}.hidden{display:none}.itemrow{display:grid;grid-template-columns:2fr .7fr 1fr .8fr;gap:6px;margin:8px 0}.small{font-size:12px;color:#aaa}.total{font-size:20px;color:#d4af37;font-weight:bold}</style></head><body><header>HZTECH BUSINESS MANAGER</header><div class="wrap"><div class="card"><h3>PILIH SYARIKAT</h3><select id="company"><option>HZTECH GROUP SDN BHD</option><option>MH GROUP ENTERPRISE</option></select></div><div id="home" class="card"><h3>MENU UTAMA</h3><div class="nav"><button onclick="openDoc('QT')">QUOTATION</button><button onclick="openDoc('INV')">INVOICE</button><button onclick="openDoc('BOQ')">CONSTRUCTION BOQ</button><button onclick="customers()">CUSTOMER</button><button onclick="projects()">PROJECT MANAGEMENT</button><button onclick="report()">REPORT & PROFIT</button></div></div><div id="doc" class="hidden"><div class="card"><button class="secondary" onclick="home()">← MENU UTAMA</button><h2 id="title"></h2><label>No. Dokumen</label><input id="no"><label>Tarikh</label><input id=
