
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HZTECH BUSINESS MANAGER</title>
<style>
body{background:#111;color:white;font-family:Arial;margin:0}
header{background:#1b1b1b;color:#d4af37;text-align:center;padding:20px;font-size:22px;font-weight:bold}
.container{padding:15px}
.card{background:#222;padding:15px;border-radius:12px;margin-bottom:15px}
h3{color:#d4af37}
input,select{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;background:#333;color:white;border:1px solid #555;border-radius:7px}
button{width:100%;padding:13px;margin:5px 0;border:0;border-radius:8px;background:#d4af37;color:#000;font-weight:bold}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:7px}
</style>
</head>
<body>
<header>HZTECH BUSINESS MANAGER</header>
<div class="container">
<div class="card">
<h3>PILIH SYARIKAT</h3>
<select id="company">
<option>HZTECH GROUP SDN BHD</option>
<option>MH GROUP ENTERPRISE</option>
</select>
</div>

<div class="card">
<h3>DOKUMEN</h3>
<button onclick="showDoc('QT')">QUOTATION</button>
<button onclick="showDoc('INV')">INVOICE</button>
</div>

<div id="form"></div>
</div>

<script>
let n=0;
function showDoc(type){
n=0;
let title=type==="QT"?"QUOTATION":"INVOICE";
document.getElementById("form").innerHTML=`
<div class="card">
<h3>${title}</h3>
<input id="docno" placeholder="No. Dokumen">
<input id="date" type="date">
<input id="due" type="date" placeholder="Tarikh akhir">
<input id="customer" placeholder="Nama pelanggan">
<input id="address" placeholder="Alamat pelanggan">
<input id="project" placeholder="Nama projek">
${type==="INV"?'<select id="status"><option>UNPAID</option><option>PAID</option></select>':''}
</div>
<div class="card">
<h3>ITEM KERJA</h3>
<table id="items"><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr></table>
<button onclick="addItem()">+ TAMBAH ITEM</button>
</div>
<div class="card">
<label>Profit (%)</label><input id="profit" type="number" value="0" oninput="calc()">
<p>Subtotal RM <span id="sub">0.00</span></p>
<p>Profit RM <span id="prof">0.00</span></p>
<h3>Jumlah RM <span id="grand">0.00</span></h3>
</div>
<button onclick="pdf('${type}')">CETAK / SAVE PDF</button>`;
document.getElementById("date").value=new Date().toISOString().slice(0,10);
document.getElementById("docno").value=type+"-"+Date.now().toString().slice(-6);
addItem();
}
function addItem(){
n++;
let r=document.getElementById("items").insertRow();
r.innerHTML=`<td><input placeholder="Item ${n}"></td>
<td><input type="number" value="1" oninput="calc()"></td>
<td><input type="number" value="0" oninput="calc()"></td>
<td class="total">0.00</td>`;
calc();
}
function calc(){
let s=0;
document.querySelectorAll("#items tr").forEach((r,i)=>{
if(i===0)return;
let q=+r.cells[1].querySelector("input").value||0;
let p=+r.cells[2].querySelector("input").value||0;
let t=q*p;r.cells[3].innerText=t.toFixed(2);s+=t;
});
let pr=s*(+document.getElementById("profit").value||0)/100;
document.getElementById("sub").innerText=s.toFixed(2);
document.getElementById("prof").innerText=pr.toFixed(2);
document.getElementById("grand").innerText=(s+pr).toFixed(2);
}
function pdf(type){
let company=document.getElementById("company").value;
let rows="";
document.querySelectorAll("#items tr").forEach((r,i)=>{
if(i===0)return;
rows+="<tr>"+Array.from(r.cells).map((c,j)=>"<td>"+(j===0?c.querySelector("input").value:c.innerText)+"</td>").join("")+"</tr>";
});
let w=window.open("","_blank");
w.document.write(`<html><head><title>${type}</title>
<style>body{font-family:Arial;padding:30px}h1{color:#b38b20}
table{width:100%;border-collapse:collapse;margin-top:20px}
td,th{border:1px solid #777;padding:8px}</style></head><body>
<h1>${company}</h1><h2>${type==="QT"?"QUOTATION":"INVOICE"}</h2>
<p>No: ${docno.value}<br>Date: ${date.value}<br>Due: ${due.value||"-"}</p>
<p>Customer: ${customer.value}<br>Address: ${address.value}<br>Project: ${project.value}</p>
${type==="INV"?"<h3>Status: "+status.value+"</h3>":""}
<table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th></tr>${rows}</table>
<h3>Subtotal RM ${sub.innerText}</h3><h3>Profit RM ${prof.innerText}</h3>
<h2>Grand Total RM ${grand.innerText}</h2>
<br><br>________________________<br>Authorized Signature
<script>window.onload=function(){window.print()}<\/script>
</body></html>`);
w.document.close();
}
</script>
</body>
</html>
