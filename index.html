
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HZTECH BUSINESS MANAGER</title>
<style>
body{margin:0;background:#101010;color:#fff;font-family:Arial}
header{background:#171717;padding:22px;color:#d4af37;text-align:center;font-size:23px;font-weight:bold}
.container{padding:18px}
.card{background:#202020;padding:18px;margin:12px 0;border-radius:14px;border:1px solid #444}
button{background:#d4af37;color:#000;border:0;padding:14px;border-radius:9px;font-weight:bold;width:100%;margin:6px 0;font-size:16px}
input,select{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;background:#333;color:white;border:1px solid #555;border-radius:8px}
h3{color:#d4af37}
</style>
</head>
<body>
<header>HZTECH BUSINESS MANAGER</header>
<div class="container">
<div class="card">
<h3>PILIH SYARIKAT</h3>
<select id="company">
<option>HZTECH GROUP SDN BHD</option>
<option>MH GROUP ENTERPRISE</option>
</select>
</div>
<div class="card">
<h3>MENU UTAMA</h3>
<button onclick="openForm('quotation')">QUOTATION</button>
<button onclick="openForm('invoice')">INVOICE</button>
<button onclick="openForm('boq')">CONSTRUCTION BOQ</button>
<button onclick="openForm('customer')">CUSTOMER</button>
<button onclick="openForm('project')">PROJECT MANAGEMENT</button>
<button onclick="openForm('report')">REPORT & PROFIT</button>
</div>
<div id="form"></div>
</div>
<script>
function openForm(type){
let title=type.toUpperCase();
let html='<div class="card"><h3>'+title+'</h3>';
if(type==='quotation'||type==='invoice'){
html+='<input placeholder="Nama pelanggan"><input placeholder="No. telefon"><input placeholder="Alamat">';
html+='<input placeholder="Nama kerja / projek"><input type="number" placeholder="Jumlah RM">';
html+='<button onclick="saveDoc(\''+type+'\')">SIMPAN</button>';
}
if(type==='boq'){
html+='<input placeholder="Nama projek"><input placeholder="Item kerja">';
html+='<input type="number" id="cost" placeholder="Kos (RM)"><input type="number" id="profit" placeholder="Profit %">';
html+='<button onclick="calc()">KIRA HARGA JUAL</button><p id="result"></p>';
}
if(type==='customer')html+='<input placeholder="Nama pelanggan"><input placeholder="Telefon"><input placeholder="Alamat"><button onclick="alert(\'Fungsi pelanggan akan dibina\')">SIMPAN</button>';
if(type==='project')html+='<input placeholder="Nama projek"><input placeholder="Lokasi"><input placeholder="Status"><button onclick="alert(\'Fungsi projek akan dibina\')">SIMPAN</button>';
if(type==='report')html+='<p>Ringkasan keuntungan akan dipaparkan di sini.</p>';
html+='</div>';
document.getElementById('form').innerHTML=html;
}
function calc(){
let c=Number(document.getElementById('cost').value);
let p=Number(document.getElementById('profit').value);
document.getElementById('result').innerHTML='Harga jual: RM '+(c+c*p/100).toFixed(2);
}
function saveDoc(type){
alert(type.toUpperCase()+' berjaya disimpan (demo).');
}
</script>
</body>
</html>
